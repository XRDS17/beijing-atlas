name: Publish Beijing Atlas

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the compiled website
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get compiled files from this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$ATLAS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern atlas-site.tar.gz
          mkdir website
          tar -xzf atlas-site.tar.gz -C website
          test -f website/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
